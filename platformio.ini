; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
boards_dir = ./board/LilyGoWatch-S3
default_envs = twatch-s3
src_dir = .

[env:twatch-s3]
platform = espressif32@6.3.0
framework = arduino
board = LilyGoWatch-S3
lib_deps = 
	https://github.com/Xinyuan-LilyGO/TTGO_TWatch_Library.git#t-watch-s3
	kosme/arduinoFFT @ 1.6
	lewisxhe/SensorLib @ 0.1.8
	mikalhart/TinyGPSPlus @ ^1.0.3
	bodmer/TFT_eWidget@^0.0.6
build_flags = 
	-DARDUINO_USB_CDC_ON_BOOT=1
	
	
	-DCORE_DEBUG_LEVEL=0
	
	-DBOARD_HAS_PSRAM
	-DDISABLE_ALL_LIBRARY_WARNINGS
	-Wnarrowing
	-include extras/Setup212_LilyGo_T_Watch_S3.h
	-DUSER_SETUP_LOADED
	
	-DRADIOLIB_EXCLUDE_CC1101
	-DRADIOLIB_EXCLUDE_NRF24
	-DRADIOLIB_EXCLUDE_RF69
	-DRADIOLIB_EXCLUDE_SX1231
	-DRADIOLIB_EXCLUDE_SI443X
	-DRADIOLIB_EXCLUDE_RFM2X
	-DRADIOLIB_EXCLUDE_SX127X
	-DRADIOLIB_EXCLUDE_AFSK
	-DRADIOLIB_EXCLUDE_AX25
	-DRADIOLIB_EXCLUDE_HELLSCHREIBER
	-DRADIOLIB_EXCLUDE_MORSE
	-DRADIOLIB_EXCLUDE_RTTY
	-DRADIOLIB_EXCLUDE_SSTV
	-DRADIOLIB_EXCLUDE_DIRECT_RECEIVE
	-DRADIOLIB_EXCLUDE_APRS
	-DRADIOLIB_EXCLUDE_BELL
