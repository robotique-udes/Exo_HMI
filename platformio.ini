[env:m5stack-core2]
platform = espressif32@7.0.0
board = m5stack-core2
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = huge_app.csv
build_flags =
    -DBOARD_HAS_PSRAM
lib_deps =
    m5stack/M5Unified
; Decommenter et adapter si la detection automatique ne convient pas :
; upload_port = COM5
; monitor_port = COM5
